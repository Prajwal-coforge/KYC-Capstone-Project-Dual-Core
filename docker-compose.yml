# Three services:
#   mock     - fictional enterprise service on 127.0.0.1:8766 (loopback only; SQLite mock.sqlite)
#   postgres - copilot knowledge store (not the mock bank)
#   dev      - working shell; shares mock's network so http://127.0.0.1:8766 works
# The repo is bind-mounted at /app. Copilot state in Compose is Postgres (`kyc-postgres`).
# Local/assessor runs without Compose still default to `--db .state/app.sqlite`.
x-common: &common
  image: kyc-capstone:dev
  build: .
  working_dir: /app
  volumes:
    - .:/app
    - kyc-state:/app/.state

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.example
    volumes:
      - kyc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc -d kyc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mock:
    <<: *common
    command: ["uv", "run", "--locked", "python", "tools/runtime.py", "serve", "--port", "8766"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8766/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dev:
    <<: *common
    command: ["sleep", "infinity"]
    network_mode: "service:mock"
    environment:
      KYC_DATABASE_URL: postgresql://kyc:kyc@postgres:5432/kyc?sslmode=disable
    depends_on:
      mock:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  kyc-state:
  kyc-postgres:
