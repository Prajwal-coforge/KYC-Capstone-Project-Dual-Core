# CI for the graded path: locked tests on the runner, then the same checks
# inside the Compose image. There is no cloud deploy in this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run --locked ruff check src tests
          uv run --locked ruff format --check src tests

      # Full tree: architecture boundaries, ingest, rules, tools client,
      # tracing and SLO metrics, narrative, packet citations, and the
      # pipeline run of all 12 dev cases through the supplied evaluator.
      - name: All tests
        run: uv run --locked python -m pytest tests

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Compose image
        run: docker build -t kyc-capstone:ci .

      - name: Ruff and pytest inside the image
        run: |
          docker run --rm kyc-capstone:ci uv run --locked ruff check src tests
          docker run --rm kyc-capstone:ci uv run --locked ruff format --check src tests
          docker run --rm kyc-capstone:ci uv run --locked python -m pytest tests
